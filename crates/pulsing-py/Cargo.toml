[package]
name = "pulsing-py"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Python bindings for Pulsing Actor System"

# Dual distribution (pick one at build time):
#   extension-module — maturin / pip wheel (cdylib loaded by user's Python)
#   embedded         — pulsing-cli single binary (PyO3 auto-initialize + rlib)
[features]
default = ["tls"]
tls = ["pulsing-actor/tls"]
extension-module = ["pyo3/extension-module"]
embedded = ["pyo3/auto-initialize"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pulsing-actor = { workspace = true }
pulsing-forge = { path = "../pulsing-forge" }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
pythonize = "0.23"
uuid = { workspace = true }
crossbeam-channel = "0.5"

[dependencies.pyo3]
version = "0.23.4"
default-features = false
features = [
  "macros",
  "experimental-async",
  "py-clone",
  "abi3-py310",
]

[dependencies.pyo3-async-runtimes]
version = "0.23.0"
default-features = false
features = [
  "attributes",
  "tokio-runtime",
  "unstable-streams",
]
