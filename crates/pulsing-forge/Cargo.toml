[package]
name = "pulsing-forge"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "Pulsing Forge — Codex-compatible agent tool runtime (sandbox + handlers)"
repository.workspace = true

[lib]
name = "pulsing_forge"
path = "src/lib.rs"

[[bin]]
name = "pulsing-forge-repl"
path = "src/bin/pulsing-forge-repl.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
chrono = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
futures = { workspace = true }
futures-util = { workspace = true }
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
libc = "0.2"
portable-pty = "0.9"
reedline = "0.39"
regex = "1"
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
shlex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.10"
streaming-iterator = "0.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
tokio-util = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
url = "2"
uuid = { workspace = true, features = ["v4", "serde"] }
rmcp = { version = "1.7.0", default-features = false, features = [
    "auth",
    "base64",
    "client",
    "macros",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
dead_code = "allow"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
