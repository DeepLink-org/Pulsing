[package]
name = "pulsing-forge-hub"
version = "0.1.0"
edition = "2021"
description = "Coordination runtime: deterministic hub + tide (codex turn management)"
license = "Apache-2.0"

[dependencies]
pulsing-forge-core = { path = "../pulsing-forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "time", "sync"] }
