[package]
name = "pulsing-rpymod"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "RustPython native bindings for Pulsing (Path B single binary)"
repository.workspace = true

[lib]
name = "pulsing_rpymod"
path = "src/lib.rs"

[dev-dependencies]
rustpython = { version = "0.5", default-features = false, features = [
    "stdlib",
    "importlib",
    "stdio",
    "host_env",
] }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
futures = { workspace = true }
pulsing-actor = { workspace = true }
pulsing-bindings-core = { path = "../pulsing-bindings-core" }
rustpython-derive = "0.5"
rustpython-vm = { version = "0.5", default-features = false, features = [
    "compiler",
    "stdio",
    "host_env",
] }
serde = { workspace = true }
tokio = { workspace = true }

# RustPython 0.5 assumes POSIX_SPAWN_SETSID is c_int. Newer libc releases
# changed it to c_short; upstream fixed the conversion after 0.5
# (RustPython/RustPython#8343). Keep this constraint until the next release.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"
