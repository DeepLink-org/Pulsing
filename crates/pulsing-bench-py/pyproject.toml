[project]
name = "pulsing-bench"
version = "0.1.3"
description = "Pulsing Benchmark - LLM Inference Benchmark Tool"
readme = "../../README.md"
authors = [
    { name = "Reiase", email = "reiase@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pulsing"]  # Requires core pulsing package

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# Extension-only wheel: install ``pulsing/_bench.*`` next to the main package.
# Do NOT set python-packages/python-source — a stub pulsing/__init__.py in this
# crate used to overwrite the real package when CI ran ``pip install dist/*.whl``.
[tool.maturin]
module-name = "pulsing._bench"
