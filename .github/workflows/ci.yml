name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # 代码规范检查（快速反馈，集中检查所有格式和 lint 问题）
  # ============================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust-toolchain: stable
          python-version: '3.12'
          install-cargo-tools: 'false'
          install-python-deps: 'true'

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --exclude pulsing-py --exclude pulsing-bench-py --all-targets -- -D warnings

      - name: Python lint (ruff)
        run: ruff check python/

  # ============================================
  # Rust 构建和测试（多平台并行）
  # ============================================
  rust-test:
    name: Rust Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust-toolchain: stable
          install-cargo-tools: 'false'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude pulsing-py --exclude pulsing-bench-py --all-targets

      - name: Test
        run: cargo test --workspace --exclude pulsing-py --exclude pulsing-bench-py --all-targets

  # ============================================
  # ARM64 交叉编译检查
  # ============================================
  rust-arm64:
    name: Rust ARM64 (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            linker: aarch64-apple-darwin-gcc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust-toolchain: stable
          install-cargo-tools: 'false'

      - name: Install ARM64 target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build for ARM64
        run: cargo build --workspace --exclude pulsing-py --exclude pulsing-bench-py --all-targets --target ${{ matrix.target }}

  # ============================================
  # Rust 覆盖率收集
  # ============================================
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          rust-toolchain: stable
          install-cargo-tools: 'true'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests and collect coverage
        shell: bash
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          export CARGO_TARGET_DIR=$CARGO_LLVM_COV_TARGET_DIR
          export CARGO_INCREMENTAL=1
          cargo llvm-cov clean --workspace
          cargo nextest run --workspace --exclude pulsing-py --exclude pulsing-bench-py
          cargo llvm-cov --no-run --lcov --output-path coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage.lcov
          retention-days: 30

  # ============================================
  # Python 构建和测试（多版本并行）
  # ============================================
  python-test:
    name: Python Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          install-python-deps: 'true'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Python package
        run: maturin develop

      - name: Test with pytest
        run: pytest tests/python -v

  # ============================================
  # Python 覆盖率收集
  # ============================================
  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: '3.12'
          install-python-deps: 'true'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Python package
        run: maturin develop

      - name: Run tests and collect coverage
        run: pytest tests/python --cov=python/pulsing --cov-report=xml:coverage.xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 30

  # ============================================
  # 上传覆盖率到 Codecov
  # ============================================
  codecov:
    name: Upload Coverage
    needs: [rust-coverage, python-coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust coverage
        uses: actions/download-artifact@v4
        with:
          name: rust-coverage
          path: .
        continue-on-error: true

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: .
        continue-on-error: true

      - name: Check coverage files
        run: |
          echo "=== Coverage files check ==="
          [ -f coverage.lcov ] && echo "✓ coverage.lcov exists" || echo "✗ coverage.lcov not found"
          [ -f coverage.xml ] && echo "✓ coverage.xml exists" || echo "✗ coverage.xml not found"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov,coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  # ============================================
  # 构建 Python Wheel
  # ============================================
  build:
    name: Build Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: '3.12'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
