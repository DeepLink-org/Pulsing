[workspace]
members = [
  "crates/pulsing-actor",
  "crates/pulsing-py",
  "crates/pulsing-bindings-core",
  "crates/pulsing-rpymod",
  "crates/pulsing-workspace",
  "crates/pulsing-cli",
]
# `cargo build` without -p skips the PyO3 extension.
default-members = [
  "crates/pulsing-actor",
  "crates/pulsing-bindings-core",
  "crates/pulsing-rpymod",
  "crates/pulsing-workspace",
  "crates/pulsing-cli",
]
resolver = "3"

# Allow coverage_nightly cfg for cargo-llvm-cov
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.package]
version = "0.1.3"
edition = "2021"
description = "Pulsing - Distributed Actor Framework"
authors = ["Reiase <reiase@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/DeepLink-org/Pulsing"
keywords = ["actor", "distributed", "async"]

[workspace.dependencies]
pulsing-actor = { path = "crates/pulsing-actor" }

# Async runtime (explicit features — avoid compiling unused tokio I/O/process bits in leaf crates)
tokio = { version = "1", default-features = false, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "net", "rt"] }
tokio-stream = { version = "0.1", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
bytes = { version = "1" }
bincode = "1.3"

# Async utilities
async-trait = { version = "0.1" }
futures = { version = "0.3" }

# Concurrent data structures
dashmap = { version = "6.1" }

# Error handling
anyhow = { version = "1" }
thiserror = { version = "2.0" }

# Logging & Tracing
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "json",
  "ansi",
  "std",
] }
tracing-opentelemetry = { version = "0.28" }
opentelemetry = { version = "0.27" }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
  "grpc-tonic",
  "trace",
] }

# Utilities
uuid = { version = "1", features = ["v4", "fast-rng"] }
rand = { version = "0.9" }

# HTTP
# axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.7", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "http2",
] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26" }
rcgen = { version = "0.13" }
aws-lc-rs = { version = "1.8" }
rustls-pemfile = { version = "2" }
time = { version = "0.3" }

# Testing
tokio-test = "0.4"

# Other
probing-memtable = "0.2.5"

# Dev (`just dev`, `cargo check`): compile speed + lean intermediates.
# debug=1 → line tables only (breakpoints/backtraces without full DWARF).
[profile.dev]
debug = 1
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.build-override]
opt-level = 3

# Release (`just build-binary release=release`, wheels, CI): smaller artifacts.
# thin LTO beats fat LTO on link time; opt-level "s" ≈ "z" size with faster codegen.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "unwind"
# debuginfo only — full symbol strip can break PyO3 cdylib exports on some linkers.
# CLI binary is additionally stripped in scripts/build-binary.sh when available.
strip = "debuginfo"

[profile.release.build-override]
opt-level = 3
codegen-units = 256
